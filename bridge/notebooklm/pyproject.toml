[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kbm-notebooklm-bridge"
version = "0.1.0"
description = "KBM Notebook - NotebookLM Bridge: sidecar HTTP (FastAPI) wraps the UNOFFICIAL notebooklm-py library"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "notebooklm-py==0.8.5",
    "fastapi>=0.118,<1",
    "uvicorn>=0.34,<1",
    "pydantic>=2.7,<3",
    "python-multipart>=0.0.20,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27,<0.29",
]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
filterwarnings = [
    "ignore:Using .httpx. with .starlette.testclient.*",
]
